<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8500">
<title>Visiting Card Scanner — SHREE JI CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:20px 18px;border-bottom:5px solid #ff8500}
header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#aaa}
main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000b}
label{display:block;font-weight:700;margin:14px 0 7px}
input,textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px;background:#fff}
textarea{min-height:100px;resize:vertical}
.preview{width:100%;max-height:430px;object-fit:contain;border-radius:14px;background:#eee;display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:700;cursor:pointer}
.orange{background:#ff8500;color:#fff}.green{background:#188b45;color:#fff}.dark{background:#111;color:#fff}.gray{background:#eee;color:#222}
#file{display:none}.status{padding:12px;border-radius:10px;background:#fff3df;margin-top:12px;display:none}
.small{font-size:13px;color:#777;line-height:1.5}
</style>
</head>
<body>
<header><h1>SHREE JI CONNECT</h1><p>Visiting Card Scanner • OCR</p></header>
<main>
<section class="card">
  <div class="row">
    <label class="btn orange" for="file">📷 Take / Choose Card Photo</label>
    <button class="btn dark" id="scan" disabled>🔎 Scan Automatically</button>
  </div>
  <input id="file" type="file" accept="image/*" capture="environment">
  <img id="preview" class="preview" alt="Visiting card preview">
  <div id="status" class="status">Preparing OCR…</div>
  <p class="small">Photo எடுத்ததும் OCR தானாக text படித்து கீழே fields-ஐ நிரப்பும். தவறு இருந்தால் மட்டும் edit செய்யலாம்.</p>
</section>

<section class="card">
  <label>Name</label><input id="name" autocomplete="name" placeholder="Auto detected name">
  <label>Mobile</label><input id="mobile" autocomplete="tel" placeholder="Auto detected mobile">
  <label>Company</label><input id="company" placeholder="Auto detected company">
  <label>City</label><input id="city" placeholder="Auto detected city">
  <label>Address</label><textarea id="address" placeholder="Auto detected address"></textarea>
  <label>OCR Text</label><textarea id="raw" placeholder="Detected text"></textarea>
  <div class="row">
    <button class="btn orange" id="save">💾 Save Customer</button>
    <button class="btn gray" id="copy">📋 Copy Details</button>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let selectedFile=null;

$("file").addEventListener("change", async e=>{
  selectedFile=e.target.files?.[0];
  if(!selectedFile)return;
  $("preview").src=URL.createObjectURL(selectedFile);
  $("preview").style.display="block";
  $("scan").disabled=false;
  await scanCard();
});
$("scan").onclick=scanCard;

async function scanCard(){
  if(!selectedFile)return;
  $("status").style.display="block";
  $("status").textContent="🔎 Reading visiting card… Please wait.";
  $("scan").disabled=true;
  try{
    const result=await Tesseract.recognize(selectedFile,"eng",{
      logger:m=>{
        if(m.status==="recognizing text") $("status").textContent="🔎 Reading… "+Math.round((m.progress||0)*100)+"%";
      }
    });
    const text=(result.data.text||"").replace(/\r/g,"").trim();
    $("raw").value=text;
    fillFields(text);
    $("status").textContent="✅ Done! Details auto-filled. Check once and Save Customer.";
  }catch(err){
    console.error(err);
    $("status").textContent="❌ OCR failed. Try a clearer, well-lit card photo.";
  }finally{$("scan").disabled=false}
}

function lines(text){return text.split("\n").map(x=>x.trim()).filter(Boolean)}

function fillFields(text){
  const ls=lines(text);
  const phone=text.match(/(?:\+?\d[\d\s().-]{7,}\d)/g)||[];
  const mobile=phone.map(x=>x.replace(/[^\d+]/g,"")).find(x=>x.replace(/\D/g,"").length>=8)||"";
  $("mobile").value=mobile;

  const emailLine=ls.find(x=>/@/.test(x));
  const addressHints=/\b(road|rd|street|st|avenue|ave|park|pl|lane|ln|nagar|city|bc|ca|usa|india|pincode|pin)\b/i;
  const addr=ls.filter(x=>addressHints.test(x)&&x!==emailLine).join(", ");

  const bad=/^(ph|phone|tel|mobile|mob|email|www|http|all kinds|address)\b/i;
  const candidates=ls.filter(x=>!bad.test(x)&&x.length>=3&&!/@/.test(x)&&!/\d{5,}/.test(x));
  let name="";
  // Prefer short person-like lines, then fall back to first candidate.
  const person=candidates.find(x=>x.split(/\s+/).length>=2 && x.split(/\s+/).length<=4 && x.length<45);
  name=person||candidates[0]||"";
  $("name").value=name;

  // Company is often a prominent all-caps / jeweller / business line.
  const company=ls.find(x=>/(jeweller|jewelry|jewellery|gold|creator|llp|ltd|pvt|inc|company|traders|stores|shop)/i.test(x))||"";
  $("company").value=company;

  let city="";
  const cityLine=ls.find(x=>/\b[A-Z][a-z]+,\s*(?:BC|ON|CA|NY|TX|FL)\b/.test(x));
  if(cityLine) city=cityLine.split(",")[0].trim();
  else{
    const known=ls.find(x=>/\b(Coimbatore|Chennai|Madurai|Bengaluru|Bangalore|Mumbai|Delhi|Pune|Abbotsford|Vancouver|Toronto)\b/i.test(x));
    if(known) city=(known.match(/\b(Coimbatore|Chennai|Madurai|Bengaluru|Bangalore|Mumbai|Delhi|Pune|Abbotsford|Vancouver|Toronto)\b/i)||[""])[0];
  }
  $("city").value=city;
  $("address").value=addr;
}

$("copy").onclick=async()=>{
  const t=`Name: ${$("name").value}\nMobile: ${$("mobile").value}\nCompany: ${$("company").value}\nCity: ${$("city").value}\nAddress: ${$("address").value}`;
  await navigator.clipboard.writeText(t);
  $("status").style.display="block";$("status").textContent="✅ Details copied.";
};

$("save").onclick=()=>{
  const customer={
    id:Date.now(),name:$("name").value.trim(),mobile:$("mobile").value.trim(),
    company:$("company").value.trim(),city:$("city").value.trim(),
    address:$("address").value.trim(),createdAt:new Date().toISOString()
  };
  if(!customer.name && !customer.mobile){alert("Please scan the card or enter at least Name / Mobile.");return}
  const keys=["customers","shreeji_customers","shreeJiCustomers"];
  let saved=false;
  for(const key of keys){
    try{
      const old=JSON.parse(localStorage.getItem(key)||"[]");
      if(Array.isArray(old)){old.push(customer);localStorage.setItem(key,JSON.stringify(old));saved=true;}
    }catch(e){}
  }
  $("status").style.display="block";
  $("status").textContent=saved?"✅ Customer saved successfully.":"⚠️ Could not save customer.";
};
</script>
</body>
</html>
